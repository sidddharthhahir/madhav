<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Madhav — the Gita, answered and cited</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- Drifting starfield + nebula, drawn in app.js. Sits behind the whole
     shell; purely decorative, and aria-hidden so it is never announced. -->
<canvas id="cosmos" aria-hidden="true"></canvas>

<!-- Slowly rotating Sudarshana chakra watermark. Sacred geometry rather than
     generic ornament: the discus is Krishna's, and the 16 spokes give the
     rotation something to read against. -->
<div class="chakra-wrap" aria-hidden="true">
  <svg class="chakra" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="94" class="ck-ring"/>
    <circle cx="100" cy="100" r="76" class="ck-ring"/>
    <circle cx="100" cy="100" r="40" class="ck-ring"/>
    <circle cx="100" cy="100" r="15" class="ck-ring"/>
    <g class="ck-spokes">
      <path d="M100 6 L100 194 M6 100 L194 100 M33 33 L167 167 M167 33 L33 167"/>
      <path d="M100 24 L136 60 L100 96 L64 60 Z"/>
    </g>
  </svg>
</div>

<div id="preloader">
  <div class="pre-inner">
    <svg class="pre-chakra" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="54" class="pre-track"/>
      <circle cx="60" cy="60" r="54" class="pre-arc" id="preArc"/>
      <g class="pre-spokes">
        <path d="M60 14 L60 106 M14 60 L106 60 M27 27 L93 93 M93 27 L27 93"/>
      </g>
    </svg>
    <div class="pre-pct" id="prePct">0%</div>
    <div class="pre-deva">॥ योगः कर्मसु कौशलम् ॥</div>
    <div class="pre-gloss">yoga is skill in action</div>
  </div>
</div>

<div id="app">

  <div class="titlebar">
    <div class="brand">
      <span class="logochip"><img src="/static/logo-mark.png" alt="Madhav" width="40" height="40"></span>
      <span class="wordmark">Madhav</span>
      <span class="tagline" id="tagline">the Gita, answered and cited</span>
    </div>
    <div style="flex:1"></div>
    <button class="btn" id="btnPalette" aria-label="Find a verse">
      Find a verse <span class="kbd">⌘K</span>
    </button>
    <button class="btn ghost" id="btnCopy">Copy answer</button>
    <button class="btn ghost noprint" id="btnExportPng" title="Save this answer as a PNG image">Export PNG</button>
    <button class="btn ghost noprint" id="btnExportPdf" title="Save this answer as a PDF (via your browser's print dialog)">Export PDF</button>
    <button class="btn ghost" id="btnInspector" title="Show or hide the verse panel (⌘\)">
      Hide verse panel
    </button>
  </div>

  <div class="body">

    <aside class="sidebar">
      <div style="padding:14px 14px 10px">
        <button class="btn primary" id="btnNew">New question</button>
      </div>
      <div class="scroll">
        <div class="grouplabel">History</div>
        <div id="history"></div>
        <div class="grouplabel">Saved verses</div>
        <div id="saved"></div>
        <div class="grouplabel">Chapters</div>
        <div id="chapters"></div>
      </div>
    </aside>

    <main class="centre">
      <div class="centre-inner">
        <div class="asklabel">Question</div>
        <textarea id="q" rows="3" spellcheck="false"
          placeholder="Ask about your own life, in your own words."></textarea>
        <div id="notice"></div>
        <div class="historybanner noprint" id="historyBanner"></div>
        <div class="printonly" id="printQuestion"></div>
        <div class="answer measure" id="answer"></div>
        <div class="printonly" id="printCited"></div>
        <div class="provenance" id="provenance"></div>
        <div class="printonly printfooter">Madhav — the Gita, answered and cited</div>
      </div>
    </main>

    <aside class="inspector" id="inspector">
      <div class="insphead">
        <span class="t">Verses</span>
        <span class="kbd" id="pinCount" style="margin-left:auto"></span>
      </div>
      <div class="inspscroll" id="inspscroll">
        <div class="empty">
          <span style="color:var(--gw-text-3);font-size:13px">No verse open yet.</span>
          <span>Ask a question, or click a chapter on the left. You can also press
                ⌘K and type a verse number like 2.47.</span>
        </div>
      </div>
    </aside>

  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
