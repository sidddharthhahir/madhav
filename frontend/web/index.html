<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Without this a phone lays the page out at a virtual 980px and scales the
     result down, so every max-width media query below 980 never matches and
     the whole responsive layout is dead on the device it was written for.
     viewport-fit=cover lets the shell reach under the notch. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madhav — the Gita, answered and cited</title>
<!-- SVG first for sharpness at any density; the PNG stays as the fallback
     for anything that does not take SVG icons. -->
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/logo-mark.png">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- Drifting starfield + nebula, drawn in app.js. Sits behind the whole
     shell; purely decorative, and aria-hidden so it is never announced. -->
<canvas id="cosmos" aria-hidden="true"></canvas>

<!-- Krishna's Sudarshana chakra, turning clockwise. The geometry follows the
     Vishnu Purana / Pancharatra description rather than a generic dharma wheel:
     108 serrated edges (the 108 Upanishads), 12 spokes (the twelve Adityas, one
     per solar month), and 6 navels (the six seasons) read as the shatkona at the
     hub. Teeth all lean the same way so the rim reads as a blade with a
     direction of travel instead of a symmetric gear. Path data is generated,
     not hand-drawn -- see the note in README on regenerating it. -->
<div class="chakra-wrap" aria-hidden="true">
  <svg class="chakra" viewBox="0 0 200 200">
    <!-- 108 serrated edges, leaning with the direction of spin -->
    <path class="ck-edge" d="M100 13L101.9 4.02L105.06 13.15L107.48 4.29L110.1 13.59L113.03 4.89L115.11 14.32L118.54 5.81L120.06 15.35L123.98 7.04L124.95 16.65L129.35 8.6L129.76 18.25L134.61 10.46L134.46 20.12L139.76 12.62L139.05 22.25L144.77 15.08L143.5 24.66L149.64 17.83L147.81 27.31L154.33 20.85L151.95 30.22L158.84 24.15L155.92 33.35L163.15 27.69L159.7 36.72L167.25 31.49L163.28 40.3L171.12 35.51L166.65 44.08L174.75 39.76L169.78 48.05L178.12 44.21L172.69 52.19L181.23 48.84L175.34 56.5L184.07 53.65L177.75 60.95L186.62 58.62L179.88 65.54L188.88 63.73L181.75 70.24L190.84 68.96L183.35 75.05L192.49 74.29L184.65 79.94L193.83 79.71L185.68 84.89L194.85 85.2L186.41 89.9L195.55 90.74L186.85 94.94L195.93 96.31L187 100L195.98 101.9L186.85 105.06L195.71 107.48L186.41 110.1L195.11 113.03L185.68 115.11L194.19 118.54L184.65 120.06L192.96 123.98L183.35 124.95L191.4 129.35L181.75 129.76L189.54 134.61L179.88 134.46L187.38 139.76L177.75 139.05L184.92 144.77L175.34 143.5L182.17 149.64L172.69 147.81L179.15 154.33L169.78 151.95L175.85 158.84L166.65 155.92L172.31 163.15L163.28 159.7L168.51 167.25L159.7 163.28L164.49 171.12L155.92 166.65L160.24 174.75L151.95 169.78L155.79 178.12L147.81 172.69L151.16 181.23L143.5 175.34L146.35 184.07L139.05 177.75L141.38 186.62L134.46 179.88L136.27 188.88L129.76 181.75L131.04 190.84L124.95 183.35L125.71 192.49L120.06 184.65L120.29 193.83L115.11 185.68L114.8 194.85L110.1 186.41L109.26 195.55L105.06 186.85L103.69 195.93L100 187L98.1 195.98L94.94 186.85L92.52 195.71L89.9 186.41L86.97 195.11L84.89 185.68L81.46 194.19L79.94 184.65L76.02 192.96L75.05 183.35L70.65 191.4L70.24 181.75L65.39 189.54L65.54 179.88L60.24 187.38L60.95 177.75L55.23 184.92L56.5 175.34L50.36 182.17L52.19 172.69L45.67 179.15L48.05 169.78L41.16 175.85L44.08 166.65L36.85 172.31L40.3 163.28L32.75 168.51L36.72 159.7L28.88 164.49L33.35 155.92L25.25 160.24L30.22 151.95L21.88 155.79L27.31 147.81L18.77 151.16L24.66 143.5L15.93 146.35L22.25 139.05L13.38 141.38L20.12 134.46L11.12 136.27L18.25 129.76L9.16 131.04L16.65 124.95L7.51 125.71L15.35 120.06L6.17 120.29L14.32 115.11L5.15 114.8L13.59 110.1L4.45 109.26L13.15 105.06L4.07 103.69L13 100L4.02 98.1L13.15 94.94L4.29 92.52L13.59 89.9L4.89 86.97L14.32 84.89L5.81 81.46L15.35 79.94L7.04 76.02L16.65 75.05L8.6 70.65L18.25 70.24L10.46 65.39L20.12 65.54L12.62 60.24L22.25 60.95L15.08 55.23L24.66 56.5L17.83 50.36L27.31 52.19L20.85 45.67L30.22 48.05L24.15 41.16L33.35 44.08L27.69 36.85L36.72 40.3L31.49 32.75L40.3 36.72L35.51 28.88L44.08 33.35L39.76 25.25L48.05 30.22L44.21 21.88L52.19 27.31L48.84 18.77L56.5 24.66L53.65 15.93L60.95 22.25L58.62 13.38L65.54 20.12L63.73 11.12L70.24 18.25L68.96 9.16L75.05 16.65L74.29 7.51L79.94 15.35L79.71 6.17L84.89 14.32L85.2 5.15L89.9 13.59L90.74 4.45L94.94 13.15L96.31 4.07L100 13Z"/>
    <circle cx="100" cy="100" r="86" class="ck-ring"/>
    <circle cx="100" cy="100" r="82" class="ck-ring"/>
    <!-- 12 spokes: the twelve Adityas -->
    <path class="ck-spoke" d="M100 70 L100 18 M115 74.02 L141 28.99 M125.98 85 L171.01 59 M130 100 L182 100 M125.98 115 L171.01 141 M115 125.98 L141 171.01 M100 130 L100 182 M85 125.98 L59 171.01 M74.02 115 L28.99 141 M70 100 L18 100 M74.02 85 L28.99 59 M85 74.02 L59 28.99"/>
    <circle cx="100" cy="100" r="30" class="ck-ring"/>
    <!-- shatkona at the core of the Sudarshana yantra -->
    <path class="ck-hex" d="M100 73 L123.38 113.5 L76.62 113.5 Z M123.38 86.5 L100 127 L76.62 86.5 Z"/>
    <circle cx="100" cy="100" r="9" class="ck-ring"/>
    <!-- six navels: the six seasons -->
    <g class="ck-navel"><circle cx="100" cy="81" r="2.1"/> <circle cx="116.45" cy="90.5" r="2.1"/> <circle cx="116.45" cy="109.5" r="2.1"/> <circle cx="100" cy="119" r="2.1"/> <circle cx="83.55" cy="109.5" r="2.1"/> <circle cx="83.55" cy="90.5" r="2.1"/></g>
  </svg>
</div>

<div id="preloader">
  <div class="pre-inner">
    <!-- Chakravyuha. The spiral formation Abhimanyu could enter and not leave:
         concentric rings of troops, each turned against the next, so a gap
         broken in one ring is already covered by the time you reach the one
         behind it. Drawn as broken arcs with adjacent rings counter-rotating,
         which is exactly that property -- the gaps never stay aligned.
         The Sudarshana chakra presides over the app itself; the vyuha is what
         you pass through to get in. Generated, not hand-drawn. -->
    <svg class="pre-chakra" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="54" class="pre-track"/>
      <circle cx="60" cy="60" r="54" class="pre-arc" id="preArc"/>
      <g class="pre-vyuha">
        <path class="vy vy0" d="M60 14A46 46 0 0 1 91.95 26.91M99.84 37A46 46 0 0 1 104.63 71.13M99.84 83A46 46 0 0 1 72.68 104.22M60 106A46 46 0 0 1 28.05 93.09M20.16 83A46 46 0 0 1 15.37 48.87M20.16 37A46 46 0 0 1 47.32 15.78"/>
        <path class="vy vy1" d="M71.74 23.86A38 38 0 0 1 95.71 47M98 60A38 38 0 0 1 83.4 89.94M71.74 96.14A38 38 0 0 1 38.75 91.5M29.26 82.34A38 38 0 0 1 23.47 49.53M29.26 37.66A38 38 0 0 1 58.67 22.02"/>
        <path class="vy vy2" d="M60 30A30 30 0 0 1 87.41 47.8M90 60A30 30 0 0 1 72.2 87.41M60 90A30 30 0 0 1 32.59 72.2M30 60A30 30 0 0 1 47.8 32.59"/>
        <path class="vy vy3" d="M68.24 39.6A22 22 0 0 1 80.4 68.24M73.54 77.34A22 22 0 0 1 42.66 73.54M38.21 63.06A22 22 0 0 1 56.94 38.21"/>
        <circle cx="60" cy="60" r="6" class="vy-hub"/>
      </g>
    </svg>
    <div class="pre-pct" id="prePct">0%</div>
    <div class="pre-deva">॥ योगः कर्मसु कौशलम् ॥</div>
    <div class="pre-gloss">yoga is skill in action</div>
  </div>
</div>

<div id="app">

  <div class="titlebar">
    <button class="btn ghost menubtn" id="btnMenu" aria-label="Show chapters and history">☰</button>
    <div class="brand">
      <span class="logochip">
      <svg class="feather" viewBox="0 0 64 80" role="img"
           aria-label="Madhav — peacock feather mark">
        <title>Madhav</title>
      
        <!-- Monochrome mark. Barbs, shaft and the ocellus body are all currentColor,
             so the whole feather flips with the theme (white on dark, near-black on
             light). Only the ring and the heart carry fixed colour. That keeps one
             point of warmth without letting the eye collapse into a dark blob at
             small sizes, which is what sank the earlier green-halo version.
             NOTE: never put a double hyphen inside an XML comment. SVG is XML, so
             it is a hard parse error and the whole file silently renders nothing. -->
        <g fill="none" stroke="currentColor" stroke-linecap="round">
      
          <!-- primary barbs, left -->
          <g stroke-width="2.2" opacity=".9">
            <path d="M31 52 C 24 51, 14 49.5, 6 44.5"/>
            <path d="M31 49 C 23 47, 12 42, 4.5 34"/>
            <path d="M31 46 C 22 42, 11 34, 5 23.5"/>
            <path d="M31 43 C 23 37, 13 27, 8 15"/>
            <path d="M31 40 C 24 32, 17 20, 13 7.5"/>
            <path d="M31 37 C 26 28, 22 14, 19 3"/>
            <path d="M31.4 34 C 28.5 25, 27.5 12, 26.5 1.5"/>
          </g>
      
          <!-- primary barbs, right (mirrored about x = 32) -->
          <g stroke-width="2.2" opacity=".9">
            <path d="M33 52 C 40 51, 50 49.5, 58 44.5"/>
            <path d="M33 49 C 41 47, 52 42, 59.5 34"/>
            <path d="M33 46 C 42 42, 53 34, 59 23.5"/>
            <path d="M33 43 C 41 37, 51 27, 56 15"/>
            <path d="M33 40 C 40 32, 47 20, 51 7.5"/>
            <path d="M33 37 C 38 28, 42 14, 45 3"/>
            <path d="M32.6 34 C 35.5 25, 36.5 12, 37.5 1.5"/>
          </g>
      
          <!-- secondary barbs for density -->
          <g stroke-width="1.5" opacity=".55">
            <path d="M31 50.5 C 24 48, 13 45, 5 39"/>
            <path d="M31 47.5 C 22.5 44, 11.5 38, 4.5 29"/>
            <path d="M31 44.5 C 22.5 39, 12 30, 6.5 19"/>
            <path d="M31 41.5 C 23.5 34, 15 23, 10.5 11"/>
            <path d="M31 38.5 C 25 30, 19.5 17, 16 5"/>
            <path d="M33 50.5 C 40 48, 51 45, 59 39"/>
            <path d="M33 47.5 C 41.5 44, 52.5 38, 59.5 29"/>
            <path d="M33 44.5 C 41.5 39, 52 30, 57.5 19"/>
            <path d="M33 41.5 C 40.5 34, 49 23, 53.5 11"/>
            <path d="M33 38.5 C 39 30, 44.5 17, 48 5"/>
          </g>
      
          <!-- curled tips -->
          <g stroke-width="1.7" opacity=".8">
            <path d="M6 44.5 C 2.8 43.6, 1.2 41.4, 2.4 39.2"/>
            <path d="M4.5 34 C 1.8 32, 1.2 29.4, 2.8 28"/>
            <path d="M58 44.5 C 61.2 43.6, 62.8 41.4, 61.6 39.2"/>
            <path d="M59.5 34 C 62.2 32, 62.8 29.4, 61.2 28"/>
            <path d="M19 3 C 17.4 1.4, 15.4 1.2, 14.4 2.6"/>
            <path d="M45 3 C 46.6 1.4, 48.6 1.2, 49.6 2.6"/>
          </g>
      
          <!-- shaft -->
          <path d="M32 33 C 31.4 46, 30.4 58, 26.6 70 C 25.4 74, 24.4 76.6, 23.4 78.6"
                stroke-width="3"/>
        </g>
      
        <!-- ocellus: white body, warm ring, dark heart -->
        <ellipse cx="32" cy="26" rx="13.4" ry="14.9" fill="currentColor"/>
        <ellipse cx="32" cy="26" rx="9.4" ry="10.6" class="oc-ring"/>
        <path d="M32 18.6 C 35.9 18.6, 38.3 21.6, 38.3 25.1
                 C 38.3 29.2, 34.9 32.3, 32 34.2
                 C 29.1 32.3, 25.7 29.2, 25.7 25.1
                 C 25.7 21.6, 28.1 18.6, 32 18.6 Z" class="oc-heart"/>
        <ellipse cx="29.4" cy="22.4" rx="1.75" ry="2.25" class="oc-spec" opacity=".55"/>
      </svg>
      </span>
      <span class="wordmark">Madhav</span>
    </div>
    <div style="flex:1"></div>
    <!-- Icon-only. The labels were spelling out what the glyph and the
         tooltip already say, and three of them together took more of the bar
         than the brand did. Each keeps an aria-label so the meaning is not
         carried by the icon alone. -->
    <button class="btn iconbtn-t" id="btnRead" aria-label="Read the Gita"
            title="Read the Gita">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 5.2C8.4 4 6.4 3.5 3 3.5v11c3.4 0 5.4.5 7 1.7"/>
        <path d="M10 5.2C11.6 4 13.6 3.5 17 3.5v11c-3.4 0-5.4.5-7 1.7"/>
        <path d="M10 5.2v11"/>
      </svg>
    </button>
    <button class="btn iconbtn-t" id="btnPalette" aria-label="Find a verse (Command K)"
            title="Find a verse  ⌘K">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 L18 18"/></svg>
    </button>
    <button class="btn iconbtn-t" id="btnInspector" aria-label="Show or hide the verse panel"
            title="Verse panel  ⌘\">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M12.5 3.5 L12.5 16.5"/></svg>
    </button>
  </div>

  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <div class="body">

    <aside class="sidebar">
      <button class="drawerclose" id="btnCloseSidebar"
              aria-label="Close menu">&times;</button>
      <div style="padding:14px 14px 10px">
        <button class="btn primary" id="btnNew">New question</button>
      </div>
      <div class="scroll">
        <div class="grouplabel">History</div>
        <div id="history"></div>
        <div class="grouplabel">Saved verses</div>
        <div id="saved"></div>
        <div class="grouplabel">Chapters</div>
        <div id="chapters"></div>
      </div>
    </aside>

    <main class="centre">
      <div class="centre-inner">
        <div class="asklabel">
          <span id="askLabelText">Question</span>
          <!-- Dharma-sankata. The Mahabharata's subject is choices with no
               clean answer, and the app could only answer questions. This
               swaps the single box for two. Free: retrieval only. -->
          <button class="modeswitch" id="btnMode" type="button"
                  aria-pressed="false">Weighing two options?</button>
        </div>
        <textarea id="q" rows="3" spellcheck="false"
          placeholder="Ask about your own life, in your own words."></textarea>

        <div class="dilemma-input" id="dilemmaInput" hidden>
          <div class="dilemma-pair">
            <label class="dilemma-field">
              <span class="dl-tag">One way</span>
              <textarea id="optA" rows="2" spellcheck="false"
                placeholder="take the job in another city"></textarea>
            </label>
            <span class="dilemma-or" aria-hidden="true">⟷</span>
            <label class="dilemma-field">
              <span class="dl-tag">The other</span>
              <textarea id="optB" rows="2" spellcheck="false"
                placeholder="stay near my parents as they age"></textarea>
            </label>
          </div>
          <button class="dilemma-go" id="btnDilemma" type="button">
            Hold both <span class="cpfree">free · no model call</span>
          </button>
        </div>

        <div id="notice"></div>
        <div class="dilemma-result noprint" id="dilemmaResult"></div>
        <div class="historybanner noprint" id="historyBanner"></div>
        <div class="printonly" id="printQuestion"></div>
        <div class="answer measure" id="answer"></div>
        <div class="printonly" id="printCited"></div>
        <div class="provenance" id="provenance"></div>
        <!-- The counterweight: verses whose stance points away from the asker
             rather than at them. Free -- no model call -- so it is offered as
             a button rather than run automatically. noprint because it is an
             exploration, not part of the answer being cited. -->
        <div class="counterpoint noprint" id="counterpoint"></div>
        <div class="printonly printfooter">Madhav — the Gita, answered and cited</div>
      </div>
    </main>

    <aside class="inspector" id="inspector">
      <div class="insphead">
        <button class="drawerclose inline" id="btnCloseInspector"
                aria-label="Close verse panel">&times;</button>
        <span class="t">Verses</span>
        <span class="kbd" id="pinCount" style="margin-left:auto"></span>
      </div>
      <div class="inspscroll" id="inspscroll">
        <div class="empty">
          <span style="color:var(--gw-text-3);font-size:13px">No verse open yet.</span>
          <span>Ask a question, or click a chapter on the left. You can also press
                ⌘K and type a verse number like 2.47.</span>
        </div>
      </div>
    </aside>

  </div>
</div>

<!-- The reader. A full takeover rather than a panel: the point is that the
     app disappears and you are left with the text. Hidden from assistive
     tech and from tab order until opened, or the whole Gita sits in the tab
     sequence behind the app. Built empty and filled a chapter at a time. -->
<div id="reader" class="reader" hidden aria-hidden="true">
  <div class="rd-bar">
    <button class="rd-close" id="rdClose" aria-label="Close the reader">✕</button>
    <span class="rd-where" id="rdWhere"></span>
    <div style="flex:1"></div>
    <button class="rd-src" id="rdSource" title="Switch translator"></button>
  </div>

  <!-- The scroller. One verse per screen, snapped, so movement between
       verses is a deliberate step rather than a drift. -->
  <div class="rd-scroll" id="rdScroll" tabindex="-1"></div>

  <!-- Position in all 701, not in the chapter: the reader is one continuous
       text and the chapter divisions are stations along it. -->
  <div class="rd-rail" aria-hidden="true"><div class="rd-railfill" id="rdRail"></div></div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
